<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduLogic · Seguimiento académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="./css/style.css" rel="stylesheet">
    <style>
        :root {
            --navy: #142b4a;
            --blue: #356fe0;
            --bg: #f3f6fb
        }

        body {
            background: var(--bg);
            font-family: Inter, system-ui, sans-serif;
            color: #26364b
        }

        .sidebar {
            background: var(--navy);
            min-height: 100vh;
            color: white
        }

        .brand {
            font-weight: 800;
            letter-spacing: .3px
        }

        .nav-link {
            color: #c9d7e9;
            border-radius: 9px;
            margin: 3px 0;
            text-align: left
        }

        .nav-link.active,
        .nav-link:hover {
            background: #29476c;
            color: white
        }

        .card {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 5px 20px #152b4a0a
        }

        .metric {
            font-size: 1.8rem;
            font-weight: 750
        }

        .muted {
            color: #8090a5
        }

        .tag {
            border-radius: 99px;
            padding: 5px 10px;
            font-size: .78rem;
            background: #edf2f9
        }

        .page {
            display: none
        }

        .page.active {
            display: block
        }

        .table>:not(caption)>*>* {
            padding: .8rem
        }

        .btn-primary {
            background: var(--blue)
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-lg-2 col-md-3 sidebar p-3">
                <div class="brand fs-4 py-3">◈ EduLogic</div>
                <div class="small text-uppercase opacity-50 mt-3 mb-2">Gestión académica</div>
                <nav class="nav flex-column" id="nav">
                    <button class="nav-link active" data-page="dashboard">▦ &nbsp;Dashboard</button><button
                        class="nav-link" data-page="estudiantes">♙ &nbsp;Estudiantes</button><button class="nav-link"
                        data-page="docentes">♧ &nbsp;Docentes</button><button class="nav-link" data-page="cursos">▤
                        &nbsp;Cursos</button><button class="nav-link" data-page="calificaciones">◉
                        &nbsp;Calificaciones</button><button class="nav-link" data-page="asistencias">✓
                        &nbsp;Asistencias</button><button class="nav-link" data-page="riesgos">⚑ &nbsp;Riesgos
                        académicos</button><button class="nav-link" data-page="reportes">▧ &nbsp;Reportes</button>
                </nav>
                <div class="mt-5 small opacity-50">Sistema de apoyo docente<br>Evaluación y seguimiento</div>
            </aside>
            <main class="col-lg-10 col-md-9 p-4 p-lg-5">
                <header class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <div class="small muted">PANEL DE SEGUIMIENTO</div>
                        <h2 id="title" class="fw-bold mb-0">Dashboard</h2>
                    </div><button class="btn btn-outline-primary" onclick="refresh()">Actualizar datos</button>
                </header>
                <div id="toast" class="alert d-none"></div>
                <section class="page active" id="page-dashboard">
                    <div class="row g-3" id="metrics"></div>
                    <div class="row g-3 mt-1">
                        <div class="col-lg-6">
                            <div class="card p-4">
                                <h5>Distribución académica</h5><canvas id="riskChart" height="210"></canvas>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="card p-4">
                                <h5>Promedio por curso</h5><canvas id="courseChart" height="210"></canvas>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="card p-4">
                                <h5>Actividad académica reciente</h5><canvas id="evolutionChart" height="90"></canvas>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="page" id="page-estudiantes"></section>
                <section class="page" id="page-docentes"></section>
                <section class="page" id="page-cursos"></section>
                <section class="page" id="page-calificaciones"></section>
                <section class="page" id="page-asistencias"></section>
                <section class="page" id="page-riesgos"></section>
                <section class="page" id="page-reportes"></section>
            </main>
        </div>
    </div>
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="recordForm">
                    <div class="modal-header">
                        <h5 id="formTitle">Nuevo registro</h5><button class="btn-close"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="formFields"></div>
                    <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal"
                            type="button">Cancelar</button><button class="btn btn-primary">Guardar</button></div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
